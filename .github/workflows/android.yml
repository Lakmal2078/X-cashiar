name: Android CI Build & APK Artifacts

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate Android Project & Ensure Gradle Wrapper
        run: |
          BUILD_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          
          if [ -z "$BUILD_FILE" ]; then
            echo "Error: No build.gradle or build.gradle.kts found anywhere in repository!"
            echo "Please ensure that your Android project files are committed and pushed to this repository."
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Found Android project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          if [ ! -f "./gradlew" ]; then
            echo "gradlew wrapper script not found in repository. Generating Gradle wrapper..."
            if ! command -v gradle &> /dev/null; then
              echo "Installing Gradle on runner..."
              sudo apt-get update -qq
              sudo apt-get install -y gradle
            fi
            gradle wrapper --gradle-version 8.5
          fi
          
          chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          BUILD_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          cd "$PROJECT_DIR"
          
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Build Release APK
        run: |
          BUILD_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          cd "$PROJECT_DIR"
          
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --stacktrace --no-daemon || true
          else
            gradle assembleRelease --stacktrace --no-daemon || true
          fi
        continue-on-error: true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: warn

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: "**/build/outputs/apk/release/*.apk"
          if-no-files-found: ignore