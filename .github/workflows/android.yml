name: Android CI Build & APK Artifacts

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Find Project Root & Make Executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            find . -name "gradlew" -exec chmod +x {} \;
          fi

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
            if [ -n "$GRADLEW_PATH" ]; then
              cd $(dirname "$GRADLEW_PATH")
              ./gradlew assembleDebug --stacktrace --no-daemon
            else
              echo "Error: gradlew not found in repository!"
              exit 1
            fi
          fi

      - name: Build Release APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --stacktrace --no-daemon
          else
            GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
            if [ -n "$GRADLEW_PATH" ]; then
              cd $(dirname "$GRADLEW_PATH")
              ./gradlew assembleRelease --stacktrace --no-daemon
            fi
          fi
        continue-on-error: true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: warn

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: "**/build/outputs/apk/release/*.apk"
          if-no-files-found: ignore